name: Daily predictions

on:
  schedule:
    - cron: "0 15 * * *"  # 15:00 UTC = 11am ET (10am in winter), before the earliest tip-offs
  workflow_dispatch:       # "Run workflow" button for manual runs

permissions:
  contents: write          # to commit results back to the repo

concurrency: daily-predictions

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Completed seasons never change, so keep them between runs
      # instead of re-downloading 10 seasons from stats.nba.com daily.
      - uses: actions/cache@v4
        with:
          path: data/season_cache
          key: season-cache-${{ github.run_id }}
          restore-keys: season-cache-

      - name: Score yesterday and predict today
        run: python -m src.run_daily

      - name: Refresh charts
        run: python -m src.make_figures

      # The commit timestamp is public proof the picks were made before tip-off.
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/predictions.csv figures/
          git diff --cached --quiet || git commit -m "Daily predictions $(TZ=America/New_York date +%F)"
          git push
